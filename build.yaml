# Miryoku (QWERTY) firmware for the Boardsource Wireless Corne SMT (36 keys).
#
# Flash:
#   blecorne_left  -> left half  (the "central" that talks to your computer; ZMK Studio runs here over USB)
#   blecorne_right -> right half
#
# settings_reset clears saved settings (ZMK Studio keymap/layout choice, Bluetooth pairings).
# The one file works on BOTH halves: flash it to each half, then flash the normal files again.
# Needed once when coming from other firmware, or if the halves stop pairing with each other or a host.
#
# nice!view displays use the custom screen in boards/shields/nice_view_custom
# (left: layer, held mods, BLE profiles, WPM; right: battery, link, key map art).
---
include:
  - board: blecorne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    shield: nice_view_custom
  - board: blecorne_right
    shield: nice_view_custom
  - board: blecorne_left
    shield: settings_reset
    cmake-args: -DCONFIG_ZMK_DISPLAY=n   # blecorne.conf enables the display; no screen in this build
